<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" fill="none">
  <defs>
    <clipPath id="logo-icon-clip">
      <rect x="2" y="4" width="80" height="80" rx="18" fill="#183E75"/>
    </clipPath>
    <linearGradient id="logo-sky" x1="42" y1="44" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4AA8E4"/>
      <stop offset="100%" stop-color="#3592D0"/>
    </linearGradient>
  </defs>

  <!-- ISOTIPO -->
  <g clip-path="url(#logo-icon-clip)">
    <rect x="2" y="4" width="80" height="80" fill="#173B6F"/>
    <path d="M 2 84 L 82 84 L 82 32 C 74 40, 50 60, 2 84 Z" fill="url(#logo-sky)"/>
    <path d="M 14 84 Q 50 64 82 56" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.8" fill="none"/>
    <path d="M 34 84 L 66 44" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.6" fill="none"/>
    <path d="M 2 80 C 26 68, 46 44, 62 12 L 72 18 C 58 48, 38 73, 2 84 Z" fill="#FFFFFF"/>
    <path d="M 62 12 C 68 22, 73 35, 76 48 C 66 54, 50 64, 30 76 C 42 58, 56 34, 62 12 Z" fill="#75C3F2"/>
  </g>

  <!-- TIPOGRAFIA: MD -->
  <text 
    x="98" 
    y="56" 
    fill="#122344" 
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
    font-size="62" 
    font-weight="700" 
    letter-spacing="-0.02em"
  >MD</text>

  <!-- SUBTITULO: HEALTH & ESTHETICS -->
  <text 
    x="100" 
    y="78" 
    fill="#122344" 
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
    font-size="14.5" 
    font-weight="700" 
    letter-spacing="0.19em"
  >HEALTH &amp; ESTHETICS</text>
</svg>
